<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Francisco Murray</title>
  <meta name="description" content="Contact Francisco Murray for commissions, prints and collaborations.">
  <meta property="og:title" content="Contact — Francisco Murray">
  <meta property="og:description" content="Contact Francisco Murray for commissions, prints and collaborations.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23141414'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f3f1ec'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/photos.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-page="contact">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="top"></header>
  <main id="main" class="wrap">
    <section class="page-head">
      <h1>Say hello</h1>
      <div class="meta">
        <span class="label">Commissions · Prints · Collaborations</span>
        <p>For commissions, print enquiries or just to talk about photographs — write below and I'll reply within a few days.</p>
      </div>
    </section>
    <section class="contact">
      <aside>
        <div><span class="label">Email</span><br><a class="big" data-site="email"></a></div>
        <div><span class="label">Instagram</span><br><a class="big" data-site="instagram" target="_blank" rel="noopener"></a></div>
        <div><span class="label">Based in</span><br><span class="big" data-site="location" style="font-style:italic;font-size:1.4rem"></span></div>
      </aside>
      <form>
        <label class="field"><span class="label">Name</span><input name="name" autocomplete="name" required></label>
        <label class="field"><span class="label">Email</span><input name="email" type="email" autocomplete="email" required></label>
        <label class="field full"><span class="label">About</span>
          <select name="subject">
            <option>Commission</option><option>Print enquiry</option><option>Collaboration</option><option>Something else</option>
          </select>
        </label>
        <label class="field full"><span class="label">Message</span><textarea name="message" required></textarea></label>
        <div class="form-foot">
          <p class="form-note">Opens your email app with the message ready to send.</p>
          <button class="btn" type="submit">Send message →</button>
        </div>
      </form>
    </section>
  </main>
  <footer class="site-footer"></footer>
</body>
</html>
